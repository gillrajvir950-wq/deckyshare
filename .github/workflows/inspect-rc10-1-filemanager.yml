name: Inspect RC10.1 file manager source

on:
  push:
    branches:
      - v1.1.0-rc11-release
    paths:
      - .github/workflows/inspect-rc10-1-filemanager.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact RC10.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.0-rc.10.1 --pattern 'DeckyShare-v1.1.0-rc.10.1.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.10.1.zip -d build
          test -f build/DeckyShare/core_main.py
          test -f build/DeckyShare/main.py
          test -f build/DeckyShare/dist/index.js
      - name: Upload file manager source
        uses: actions/upload-artifact@v4
        with:
          name: rc10-1-filemanager-source
          path: |
            build/DeckyShare/core_main.py
            build/DeckyShare/main.py
            build/DeckyShare/dist/index.js
            build/DeckyShare/package.json
            build/DeckyShare/updater.py
          retention-days: 1
