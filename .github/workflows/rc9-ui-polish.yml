name: Publish DeckyShare RC9 UI polish prerelease

on:
  push:
    branches:
      - v1.1.0-rc9-release
    paths:
      - .github/workflows/rc9-ui-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC9 branch
        uses: actions/checkout@v4

      - name: Download exact RC8 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.8.zip DeckyShare-v1.1.0-rc.9.zip
          mkdir build
          gh release download v1.1.0-rc.8 --pattern 'DeckyShare-v1.1.0-rc.8.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.8.zip -d build
          test -f build/DeckyShare/main.py
          test -f build/DeckyShare/core_main.py
          test -f build/DeckyShare/dist/index.js
          test -f build/DeckyShare/share_sheet.py

      - name: Apply RC9 UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('build/DeckyShare')

          # Version metadata.
          p = root / 'package.json'
          data = json.loads(p.read_text())
          data['version'] = '1.1.0-rc.9'
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = root / 'dist' / 'index.js'
          s = p.read_text()

          # 1) Remove the visible iPhone Shortcut / Share Sheet setup card.
          # Keep the already-working backend pairing/upload routes for the
          # public Shortcut link; only the Decky panel UI is removed.
          start_marker = '      h(Card,{style:{border:"1px solid rgba(120,180,255,.22)"}},\n        h(SectionTitle,{icon:"📱",title:"iPhone Shortcut"'
          end_marker = '      h(Card,null,\n        h(SectionTitle,{icon:"📁",title:"Browse Files"'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('RC8 iPhone Shortcut card markers missing')
          s = s[:start] + s[end:]

          # 2) Replace the long version pill with a small compact RC badge.
          long_badge = 'v1.1.0-rc8 • iPhone Share Sheet'
          badge_component = 'h("div",{style:{fontSize:9,fontWeight:700,opacity:.72,padding:"2px 6px",borderRadius:999,border:"1px solid rgba(120,180,255,.20)",background:"rgba(68,122,184,.10)",whiteSpace:"nowrap"}},"RC9")'
          badge_re = re.compile(r'h\("div",\{style:\{[^{}]*\}\},"v1\.1\.0-rc8 • iPhone Share Sheet"\)')
          s, badge_count = badge_re.subn(badge_component, s, count=1)
          if badge_count != 1:
              # Fail safely if the header layout changed instead of silently
              # shipping the oversized badge again.
              raise SystemExit('Long RC8 header badge component not found')

          # 3) One native-looking monochrome icon everywhere Decky renders the
          # plugin. This deliberately uses currentColor and no image/background.
          native_icon = r'''
function DeckyShareNativeIcon({size=22}={}){
  return h("svg",{
    viewBox:"0 0 24 24",width:size,height:size,fill:"none",
    stroke:"currentColor",strokeWidth:2.15,strokeLinecap:"round",strokeLinejoin:"round",
    "aria-hidden":"true",style:{display:"block",color:"currentColor",flexShrink:0}
  },
    h("path",{d:"M5.2 12.7a7.1 7.1 0 0 0 6.1 6.1l4.1-4.1a7.1 7.1 0 0 1-6.1-6.1z"}),
    h("path",{d:"M11.3 12.7 18 6"}),
    h("path",{d:"M15.3 4.3a6.5 6.5 0 0 1 4.4 4.4"}),
    h("path",{d:"M16.7 8a2.7 2.7 0 0 1 2 2"}),
    h("path",{d:"M8.7 18.4 6.5 21"}),
    h("path",{d:"M4.8 21h5"})
  );
}
'''
          if 'function DeckyShareNativeIcon(' not in s:
              marker = 'const h = React.createElement;\n'
              if marker not in s:
                  raise SystemExit('React h marker missing')
              s = s.replace(marker, marker + native_icon + '\n', 1)

          # Replace all known DeckyShare icon component uses with the native icon.
          s = re.sub(r'h\((?:DeckyShareBrandIcon|DeckyShareIcon),\{size:(\d+)\}\)', r'h(DeckyShareNativeIcon,{size:\1})', s)
          # Legacy fallbacks from older baselines.
          s = s.replace('h("div",{style:{fontSize:29}},"◉")', 'h(DeckyShareNativeIcon,{size:32})')
          s = s.replace('icon:h("div",{style:{fontSize:20}},"↔"),', 'icon:h(DeckyShareNativeIcon,{size:22}),')

          # Force the plugin registration icon specifically, because this is
          # what Decky shows in the plugin list / top-right selected-plugin tile.
          icon_patterns = [
              r'icon:h\((?:DeckyShareBrandIcon|DeckyShareIcon|DeckyShareNativeIcon),\{size:22\}\),',
              r'icon:h\((?:DeckyShareBrandIcon|DeckyShareIcon|DeckyShareNativeIcon),\{size:24\}\),',
          ]
          replaced_registration = False
          for pat in icon_patterns:
              s, n = re.subn(pat, 'icon:h(DeckyShareNativeIcon,{size:22}),', s, count=1)
              if n:
                  replaced_registration = True
                  break
          if not replaced_registration:
              # If it was already converted by the generic replacement above,
              # the exact target should still exist.
              replaced_registration = 'icon:h(DeckyShareNativeIcon,{size:22}),' in s
          if not replaced_registration:
              raise SystemExit('Decky plugin registration icon marker missing')

          # Normalize visible RC version strings without reintroducing feature text.
          s = s.replace('v1.1.0-rc8', 'v1.1.0-rc9')
          p.write_text(s)

          # Backend label only; preserve all working RC8 behavior.
          p = root / 'main.py'
          s = p.read_text()
          s = re.sub(
              r'_core\.Handler\.server_version = "DeckyShare/[^"]+"',
              '_core.Handler.server_version = "DeckyShare/1.1.0-rc9"',
              s,
              count=1,
          )
          p.write_text(s)

          p = root / 'rc1_hardening.py'
          if p.exists():
              s = p.read_text().replace('v1.1.0-rc8', 'v1.1.0-rc9')
              p.write_text(s)
          PY

      - name: Validate RC9 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path

          root = Path('build/DeckyShare')
          package = json.loads((root / 'package.json').read_text())
          js = (root / 'dist' / 'index.js').read_text()
          core = (root / 'core_main.py').read_text()
          main = (root / 'main.py').read_text()

          assert package['version'] == '1.1.0-rc.9'
          assert 'title:"iPhone Shortcut"' not in js
          assert 'v1.1.0-rc9 • iPhone Share Sheet' not in js
          assert '"RC9"' in js
          assert 'function DeckyShareNativeIcon(' in js
          assert 'icon:h(DeckyShareNativeIcon,{size:22}),' in js
          assert '/shortcut/share' in core
          assert '/shortcut/pair' in core
          assert 'shortcut_pairing_start' in core
          assert 'DeckyShare/1.1.0-rc9' in main

          # Critical RC8 reliability/updater pieces stay present.
          assert 'decky_http_server' in core
          assert 'utilities/install_plugin' in js

          for p in root.rglob('*.py'):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          subprocess.run(['node', '--check', str(root / 'dist' / 'index.js')], check=True)
          print('RC9 validation passed: Share Sheet UI removed, badge compact, native icon registered')
          PY

          cd build
          zip -qr ../DeckyShare-v1.1.0-rc.9.zip DeckyShare
          cd ..

          python - <<'PY'
          import zipfile
          p='DeckyShare-v1.1.0-rc.9.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for required in (
                  'DeckyShare/main.py',
                  'DeckyShare/core_main.py',
                  'DeckyShare/share_sheet.py',
                  'DeckyShare/decky_http_server.py',
                  'DeckyShare/dist/index.js',
                  'DeckyShare/updater.py',
              ):
                  assert required in names
          print('RC9 ZIP validation passed')
          PY

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.9 >/dev/null 2>&1; then
            echo 'v1.1.0-rc.9 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.1.0-rc.9 DeckyShare-v1.1.0-rc.9.zip \
            --prerelease \
            --target v1.1.0-rc9-release \
            --title 'DeckyShare v1.1.0-rc.9' \
            --notes 'RC9 is a focused UI-polish build from the exact RC8 release asset. It removes the visible iPhone Shortcut/Share Sheet setup card from the Decky panel, replaces the oversized feature/version pill with a compact RC9 badge, and forces a single monochrome currentColor satellite icon for both the panel header and Decky plugin registration. The working Share Sheet/Shortcut backend, Decky 3.2.9 startup hardening, and native updater remain intact.'
