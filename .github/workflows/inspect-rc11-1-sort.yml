name: Inspect RC11.1 sort runtime

on:
  push:
    branches:
      - v1.1.0-rc11-release
    paths:
      - .github/workflows/inspect-rc11-1-sort.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact RC11.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build
          mkdir build
          gh release download v1.1.0-rc.11.1 --pattern 'DeckyShare-v1.1.0-rc.11.1.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.11.1.zip -d build
          test -f build/DeckyShare/dist/index.js
          test -f build/DeckyShare/core_main.py
      - name: Upload runtime source
        uses: actions/upload-artifact@v4
        with:
          name: rc11-1-sort-runtime
          path: |
            build/DeckyShare/dist/index.js
            build/DeckyShare/core_main.py
            build/DeckyShare/package.json
          retention-days: 1
