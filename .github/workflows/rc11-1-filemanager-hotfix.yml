name: Publish DeckyShare RC11.1 file manager hotfix

on:
  push:
    branches:
      - v1.1.0-rc11-release
    paths:
      - .github/workflows/rc11-1-filemanager-hotfix.yml
      - tools/rc11_1_hotfix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact RC11 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.11.zip DeckyShare-v1.1.0-rc.11.1.zip
          mkdir build
          gh release download v1.1.0-rc.11 --pattern 'DeckyShare-v1.1.0-rc.11.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.11.zip -d build
          test -f build/DeckyShare/core_main.py
          test -f build/DeckyShare/dist/index.js

      - name: Apply RC11.1 hotfix
        run: |
          set -euo pipefail
          python tools/rc11_1_hotfix.py

      - name: Validate RC11.1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('build/DeckyShare')
          assert json.loads((root/'package.json').read_text())['version'] == '1.1.0-rc.11.1'
          core = (root/'core_main.py').read_text()
          ui = (root/'dist/index.js').read_text()
          assert '/proc/self/mountinfo' in core
          assert 'asyncio.to_thread(browse_info, p)' in core
          assert 'with os.scandir(p) as scan:' in core
          assert 'h("select",{value:browseSort' not in ui
          assert '[["name","Name"],["date","Newest"],["size","Largest"]]' in ui
          assert 'RC11.1' in ui
          for f in root.rglob('*.py'):
              compile(f.read_text(encoding='utf-8'), str(f), 'exec')
          print('RC11.1 checks passed')
          PY
          cd build && zip -qr ../DeckyShare-v1.1.0-rc.11.1.zip DeckyShare && cd ..
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('DeckyShare-v1.1.0-rc.11.1.zip') as z:
              assert z.testzip() is None
          PY

      - name: Publish RC11.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v1.1.0-rc.11.1 >/dev/null 2>&1; then
            gh release create v1.1.0-rc.11.1 DeckyShare-v1.1.0-rc.11.1.zip --prerelease --target v1.1.0-rc11-release --title 'DeckyShare v1.1.0-rc.11.1' --notes 'Hotfix for RC11: reliable Name/Newest/Largest sort buttons in Game Mode, real removable-drive discovery instead of the /run/media/deck container, bounded removable-drive browsing, and browse work moved off the Decky RPC event loop with a timeout. RC11 mini file-manager features remain intact.'
          fi
