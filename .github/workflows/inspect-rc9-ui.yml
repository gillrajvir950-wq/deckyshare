name: Inspect RC9 UI source

on:
  push:
    branches:
      - v1.1.0-rc10-release
    paths:
      - .github/workflows/inspect-rc9-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RC9 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.1.0-rc.9 --pattern 'DeckyShare-v1.1.0-rc.9.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.9.zip -d build
          test -f build/DeckyShare/dist/index.js
          test -f build/DeckyShare/core_main.py
      - name: Upload inspection source
        uses: actions/upload-artifact@v4
        with:
          name: rc9-inspection-source
          path: |
            build/DeckyShare/dist/index.js
            build/DeckyShare/core_main.py
            build/DeckyShare/package.json
          retention-days: 1
