          )
        )
      )'''
          s = s[:start] + browse_card + s[end:]

          s = s.replace('"RC10.1"', '"RC11"', 1)
          p.write_text(s)

          # ---------- Version metadata ----------
          p = root / 'package.json'
          data = json.loads(p.read_text())
          data['version'] = '1.1.0-rc.11'
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = root / 'main.py'
          s = p.read_text()
          s = re.sub(r'_core\.Handler\.server_version = "DeckyShare/[^"]+"', '_core.Handler.server_version = "DeckyShare/1.1.0-rc11"', s, count=1)
          p.write_text(s)

          p = root / 'rc1_hardening.py'
          if p.exists():
              s = p.read_text().replace('1.1.0-rc.10.1', '1.1.0-rc.11').replace('1.1.0-rc10.1', '1.1.0-rc11')
              p.write_text(s)
          PY

      - name: Validate RC11 mini file manager
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile, types, asyncio

          root = pathlib.Path('build/DeckyShare')
          pkg = json.loads((root/'package.json').read_text())
          core = (root/'core_main.py').read_text()
          js = (root/'dist'/'index.js').read_text()
          updater = (root/'updater.py').read_text()
          main = (root/'main.py').read_text()

          assert pkg['version'] == '1.1.0-rc.11'
          assert 'DeckyShare/1.1.0-rc11' in main
          for needle in ('file_create_folder','file_rename','file_copy','file_move','file_trash','file_details','shutil.disk_usage'):
              assert needle in core, needle
          for needle in ('Mini file manager','New folder','Select all','Paste here','Trash','FM_FAVORITES_KEY','FM_RECENTS_KEY'):
              assert needle in js, needle
          # Ensure the RC10.1 updater-order fix is preserved.
          assert 'candidates = []' in updater
          assert 'compare_versions(candidate["version"], best["version"]) > 0' in updater

          for f in root.rglob('*.py'):
              compile(f.read_text(encoding='utf-8'), str(f), 'exec')
          subprocess.run(['node','--check',str(root/'dist'/'index.js')],check=True)

          # Hardware-independent filesystem regression test using a small Decky stub.
          td = tempfile.TemporaryDirectory()
          home = pathlib.Path(td.name)/'home'; home.mkdir()
          for name in ('Downloads','Desktop','Videos'):(home/name).mkdir()
          settings = pathlib.Path(td.name)/'settings'; settings.mkdir()
          class Log:
              def info(self,*a,**k): pass
              def warning(self,*a,**k): pass
              def exception(self,*a,**k): pass
          decky = types.ModuleType('decky')
          decky.DECKY_USER_HOME=str(home); decky.DECKY_PLUGIN_SETTINGS_DIR=str(settings); decky.logger=Log()
          async def emit(*a,**k): return None
          decky.emit=emit
          sys.modules['decky']=decky
          sys.path.insert(0,str(root))
          import core_main as cm

          src = home/'Downloads'/'alpha.txt'; src.write_text('abc')
          folder = cm._fm_create_folder(str(home/'Downloads'),'Folder A')['item']
          assert pathlib.Path(folder['path']).is_dir()
          renamed = cm._fm_rename(str(src),'beta.txt')['item']
          assert pathlib.Path(renamed['path']).name == 'beta.txt'
          copied = cm._fm_copy_or_move([renamed['path']],str(home/'Desktop'),False)['items'][0]
          assert pathlib.Path(copied['path']).read_text() == 'abc'
          moved = cm._fm_copy_or_move([copied['path']],str(home/'Videos'),True)['items'][0]
          assert pathlib.Path(moved['path']).exists() and not pathlib.Path(copied['path']).exists()
          details = cm._fm_details(moved['path'])['item']
          assert details['size'] == 3 and details['storage']['total'] > 0
          cm._fm_trash([moved['path']])
          assert not pathlib.Path(moved['path']).exists()
          listing = cm.browse_info(str(home/'Downloads'))
          assert listing['storage']['free'] >= 0
          print('RC11 mini file manager regression tests passed')
          PY

          cd build && zip -qr ../DeckyShare-v1.1.0-rc.11.zip DeckyShare && cd ..
          python - <<'PY'
          import zipfile
          p='DeckyShare-v1.1.0-rc.11.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ('DeckyShare/main.py','DeckyShare/core_main.py','DeckyShare/dist/index.js','DeckyShare/updater.py','DeckyShare/decky_http_server.py'):
                  assert req in names, req
          print('RC11 ZIP validation passed')
          PY

      - name: Publish RC11 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.11 >/dev/null 2>&1; then
            echo 'RC11 already exists; leaving unchanged.'
            exit 0
          fi
          gh release create v1.1.0-rc.11 DeckyShare-v1.1.0-rc.11.zip \
            --prerelease \
            --target v1.1.0-rc11-release \
            --title 'DeckyShare v1.1.0-rc.11' \
            --notes 'RC11 turns Browse Files into a mini file manager. It adds multi-select, New Folder, Rename, Copy, Move with destination/paste flow, safe Move to Trash with confirmation, file/folder Details, storage usage, Favorites, Recent folders, Select All, and browsing of ordinary file types instead of only a small extension whitelist. It is built from the exact RC10.1 package, so the working Share Sheet backend, Decky 3.2.9 hardening, icon/UI fixes, and semantic-version updater hotfix remain intact.'
