          }),
          visibleBrowseItems.length>200&&h("div",{style:{fontSize:9,opacity:.42,textAlign:"center",paddingTop:5}},`Showing first 200 of ${visibleBrowseItems.length} items`),

          selectionMode&&selectedItems.length>0&&h("div",{style:{position:"sticky",bottom:4,zIndex:3,marginTop:8,padding:8,borderRadius:12,background:"rgba(9,22,38,.97)",border:"1px solid rgba(102,192,244,.28)",boxShadow:"0 7px 24px rgba(0,0,0,.35)"}},
            h("div",{style:{fontSize:10,fontWeight:760,marginBottom:6}},`${selectedItems.length} selected${selectedBytes?` • ${fmt(selectedBytes)}`:""}`),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5}},
              h(MiniButton,{onClick:()=>shareMultiSelection(selectedItems)},"Share"),
