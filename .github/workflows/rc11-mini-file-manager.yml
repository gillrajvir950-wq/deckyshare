              h(MiniButton,{onClick:()=>beginClipboard("move")},"Move"),
              h(MiniButton,{onClick:()=>{if(selectedItems.length===1){setRenameTarget(selectedItems[0]);setRenameValue(selectedItems[0].name);setFmDetails(null);}else setErr("Rename: select exactly one item");}},"Rename"),
              h(MiniButton,{onClick:()=>selectedItems.length===1?showDetails(selectedItems[0]):setErr("Details: select exactly one item")},"Details"),
              h(MiniButton,{onClick:trashSelected,tone:"danger"},fmArmed==="trash"?"Tap again":"Trash")
