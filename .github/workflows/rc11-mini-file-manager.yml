            h("div",{style:{opacity:.52}},browseDate(fmDetails.mtime)?`Modified ${browseDate(fmDetails.mtime)}`:""),
            h("div",{style:{marginTop:5}},h(MiniButton,{onClick:()=>setFmDetails(null)},"Close details"))
          ),

          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 96px",gap:6,marginBottom:7}},
            h("input",{value:browseQuery,onChange:e=>setBrowseQuery(e.target.value),placeholder:"Search this folder",style:{minWidth:0,width:"100%",boxSizing:"border-box",padding:"9px 10px",borderRadius:10,border:"1px solid rgba(120,180,255,.18)",background:"rgba(7,17,29,.48)",color:"white",fontSize:11,outline:"none"}}),
            h("select",{value:browseSort,onChange:e=>setBrowseSort(e.target.value),style:{width:"100%",padding:"8px 6px",borderRadius:10,border:"1px solid rgba(120,180,255,.18)",background:"#14263c",color:"white",fontSize:10}},h("option",{value:"name"},"Name"),h("option",{value:"date"},"Newest"),h("option",{value:"size"},"Largest"))
          ),

          h("div",{style:{display:"flex",gap:4,overflowX:"auto",paddingBottom:4,marginBottom:4}},roots.map(r=>h("button",{key:r.path,onClick:()=>browse(r.path),style:{flex:"0 0 auto",padding:"5px 7px",borderRadius:999,border:path===r.path?"1px solid #66c0f4":"1px solid rgba(120,180,255,.14)",background:path===r.path?"rgba(102,192,244,.13)":"rgba(255,255,255,.025)",color:path===r.path?"#a9ddff":"#d9edff",fontSize:9,fontWeight:700}},r.name.startsWith("Drive:")?`💾 ${r.name.replace("Drive: ","")}`:r.name))),

          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:7,fontSize:9,opacity:.5,margin:"4px 1px 7px"}},
            h("span",null,`${visibleBrowseItems.length} item${visibleBrowseItems.length===1?"":"s"}${browseQuery?` matching “${browseQuery}”`:""}`),
            selectionMode&&h("button",{onClick:selectedPaths.length===visibleBrowseItems.length?clearMulti:selectAllVisible,style:{border:0,background:"transparent",color:"#8fd3ff",fontSize:9,fontWeight:700}},selectedPaths.length===visibleBrowseItems.length&&visibleBrowseItems.length?"Clear all":"Select all")
          ),

          !visibleBrowseItems.length?h("div",{style:{padding:"15px 8px",textAlign:"center",fontSize:11,opacity:.5,border:"1px dashed rgba(120,180,255,.14)",borderRadius:10}},browseQuery?"No matching items in this folder":"This folder is empty"):visibleBrowseItems.slice(0,200).map(it=>{
            const chosen=selectedPaths.includes(it.path);
            const open=()=>{if(selectionMode)toggleItem(it);else if(it.type==="dir")browse(it.path);else selectFile(it.path);};
            return h("div",{key:it.path,style:{display:"flex",gap:6,alignItems:"stretch",margin:"4px 0"}},
              selectionMode&&h("button",{onClick:()=>toggleItem(it),style:{width:31,borderRadius:9,border:chosen?"1px solid #66c0f4":"1px solid rgba(120,180,255,.14)",background:chosen?"rgba(102,192,244,.18)":"rgba(20,39,63,.56)",color:chosen?"#bfe7ff":"#70869c",fontWeight:900}},chosen?"✓":"○"),
              h("button",{onClick:open,style:{flex:1,minWidth:0,padding:"8px 9px",borderRadius:11,border:chosen?"1px solid rgba(102,192,244,.48)":"1px solid rgba(120,180,255,.11)",background:chosen?"rgba(48,92,132,.70)":"rgba(20,39,63,.56)",color:"white",textAlign:"left"}},
                h("div",{style:{display:"flex",gap:9,alignItems:"center"}},
                  h("div",{style:{width:32,height:32,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:it.type==="dir"?"rgba(102,192,244,.10)":"rgba(255,255,255,.045)",fontSize:17,flexShrink:0}},browseFileIcon(it)),
                  h("div",{style:{minWidth:0,flex:1}},h("div",{style:{fontWeight:720,fontSize:11,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},it.name),h("div",{style:{fontSize:9,opacity:.48,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},it.type==="dir"?(browseDate(it.mtime)?`Folder • ${browseDate(it.mtime)}`:"Folder"):`${it.size_human||fmt(Number(it.size||0))}${browseDate(it.mtime)?` • ${browseDate(it.mtime)}`:""}`)),
                  h("div",{style:{fontSize:15,opacity:.36}},it.type==="dir"?"›":"")
