name: Publish DeckyShare RC11 mini file manager

on:
  push:
    branches:
      - v1.1.0-rc11-release
    paths:
      - .github/workflows/rc11-mini-file-manager.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact RC10.1 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.10.1.zip DeckyShare-v1.1.0-rc.11.zip
          mkdir build
          gh release download v1.1.0-rc.10.1 --pattern 'DeckyShare-v1.1.0-rc.10.1.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.10.1.zip -d build
          test -f build/DeckyShare/core_main.py
          test -f build/DeckyShare/main.py
          test -f build/DeckyShare/dist/index.js
          test -f build/DeckyShare/updater.py

      - name: Add mini file manager backend and UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('build/DeckyShare')

          # ---------- Backend ----------
          p = root / 'core_main.py'
          s = p.read_text()
          if 'import shutil\n' not in s:
              s = s.replace('import os\n', 'import os\nimport shutil\n', 1)

          # A real file manager should show all ordinary files under allowed roots.
          s = s.replace('elif child.is_file() and child.suffix.lower() in ALL_EXTS:', 'elif child.is_file():')

          old_return = '    return {"path": str(p), "parent": parent, "items": items}\n\n\ndef qr_data_uri(address):'
          if old_return not in s:
              raise SystemExit('browse_info return marker missing')

          fm_helpers = r'''    usage = shutil.disk_usage(p)
    storage = {
        "total": usage.total,
        "used": usage.used,
        "free": usage.free,
        "total_human": human_size(usage.total),
        "used_human": human_size(usage.used),
        "free_human": human_size(usage.free),
    }
    return {"path": str(p), "parent": parent, "items": items, "storage": storage}


def _fm_payload(payload=None, kwargs=None):
    if isinstance(payload, dict):
        return dict(payload)
    return dict(kwargs or {})


def _fm_path(raw, *, must_exist=True):
    if raw is None or str(raw).strip() == "":
        raise ValueError("Missing path")
    original = Path(str(raw)).expanduser()
    if original.is_symlink():
        raise ValueError("Symbolic links are not managed by DeckyShare")
    p = original.resolve()
    if not path_allowed(p):
        raise ValueError("Path is outside DeckyShare allowed locations")
    if must_exist and not p.exists():
        raise ValueError("Item not found")
    return p


def _fm_is_root(p):
    p = Path(p).resolve()
    return any(p == root for _, root in allowed_roots())


def _fm_clean_name(value):
    name = str(value or "").strip()
    if not name or name in (".", "..") or Path(name).name != name or "/" in name or "\\" in name or "\x00" in name:
        raise ValueError("Invalid name")
    if len(name.encode("utf-8")) > 240:
        raise ValueError("Name is too long")
    return name


def _fm_unique(parent, name, is_dir=False):
    parent = Path(parent)
    target = parent / name
    if not target.exists():
        return target
    if is_dir:
        stem, suffix = name, ""
    else:
        q = Path(name)
        stem, suffix = q.stem or q.name, q.suffix
    i = 1
    while i < 10000:
        candidate = parent / f"{stem} ({i}){suffix}"
        if not candidate.exists():
            return candidate
        i += 1
    raise ValueError("Could not find a free destination name")


def _fm_entry(p):
    p = Path(p)
    st = p.stat()
    is_dir = p.is_dir()
    item = {
        "name": p.name,
        "path": str(p),
        "type": "dir" if is_dir else "file",
        "mtime": st.st_mtime,
        "size": 0 if is_dir else st.st_size,
        "size_human": "Folder" if is_dir else human_size(st.st_size),
    }
    if not is_dir:
        item["mime"] = mimetypes.guess_type(p.name)[0] or "application/octet-stream"
    return item


def _fm_create_folder(parent, name):
    base = _fm_path(parent)
    if not base.is_dir():
        raise ValueError("Destination is not a folder")
    clean = _fm_clean_name(name)
    target = (base / clean).resolve()
    if not path_allowed(target):
        raise ValueError("Folder destination is not allowed")
    if target.exists():
        raise ValueError("An item with that name already exists")
    target.mkdir()
    return {"ok": True, "item": _fm_entry(target)}


def _fm_rename(path, new_name):
    source = _fm_path(path)
    if _fm_is_root(source):
        raise ValueError("Quick locations cannot be renamed")
    clean = _fm_clean_name(new_name)
    target = (source.parent / clean).resolve()
    if not path_allowed(target):
        raise ValueError("Rename destination is not allowed")
    if target.exists():
        raise ValueError("An item with that name already exists")
    source.rename(target)
    if STATE.selected and Path(STATE.selected).resolve() == source:
        STATE.selected = target if target.is_file() else None
    return {"ok": True, "item": _fm_entry(target)}


def _fm_sources(paths):
    if not isinstance(paths, list) or not paths:
        raise ValueError("Select at least one item")
    if len(paths) > 100:
        raise ValueError("Too many items selected")
    out = []
    seen = set()
    for raw in paths:
        p = _fm_path(raw)
        if _fm_is_root(p):
            raise ValueError("Quick locations cannot be modified")
        key = str(p)
        if key not in seen:
            seen.add(key)
            out.append(p)
    return out


def _fm_copy_or_move(paths, destination, move=False):
    sources = _fm_sources(paths)
    dest = _fm_path(destination)
    if not dest.is_dir():
        raise ValueError("Destination is not a folder")
    results = []
    for source in sources:
        if source.is_dir():
            try:
                dest.relative_to(source)
                raise ValueError("A folder cannot be copied or moved inside itself")
            except ValueError as exc:
                if str(exc) == "A folder cannot be copied or moved inside itself":
                    raise
        if move and source.parent == dest:
            results.append(_fm_entry(source))
            continue
        target = _fm_unique(dest, source.name, source.is_dir())
        if move:
            shutil.move(str(source), str(target))
            if STATE.selected and Path(STATE.selected).resolve() == source:
                STATE.selected = target if target.is_file() else None
        elif source.is_dir():
            shutil.copytree(source, target, symlinks=True)
        else:
            shutil.copy2(source, target)
        results.append(_fm_entry(target))
    return {"ok": True, "items": results, "mode": "move" if move else "copy"}


def _fm_trash(paths):
    sources = _fm_sources(paths)
    home = Path(decky.DECKY_USER_HOME).resolve()
    trash = home / ".local" / "share" / "Trash"
    files_dir = trash / "files"
    info_dir = trash / "info"
    files_dir.mkdir(parents=True, exist_ok=True)
    info_dir.mkdir(parents=True, exist_ok=True)
    results = []
    deletion_date = time.strftime("%Y-%m-%dT%H:%M:%S")
    for source in sources:
        target = _fm_unique(files_dir, source.name, source.is_dir())
        original = str(source)
        shutil.move(str(source), str(target))
        info = "[Trash Info]\nPath=" + urllib.parse.quote(original, safe="/") + "\nDeletionDate=" + deletion_date + "\n"
        (info_dir / (target.name + ".trashinfo")).write_text(info, encoding="utf-8")
        if STATE.selected and Path(STATE.selected).resolve() == Path(original).resolve():
            STATE.selected = None
        results.append({"name": target.name, "original": original})
    return {"ok": True, "trashed": results}


def _fm_details(path):
    p = _fm_path(path)
    item = _fm_entry(p)
    if p.is_dir():
        count = 0
        try:
            for child in p.iterdir():
                if not child.name.startswith("."):
                    count += 1
                    if count >= 10000:
                        break
        except OSError:
            count = None
        item["item_count"] = count
    usage = shutil.disk_usage(p if p.is_dir() else p.parent)
    item["storage"] = {
        "total": usage.total,
        "used": usage.used,
        "free": usage.free,
        "total_human": human_size(usage.total),
        "used_human": human_size(usage.used),
        "free_human": human_size(usage.free),
    }
    return {"ok": True, "item": item}


