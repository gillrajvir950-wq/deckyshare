name: Publish DeckyShare RC11 mini file manager

on:
  push:
    branches:
      - v1.1.0-rc11-release
    paths:
      - .github/workflows/rc11-mini-file-manager.yml
      - tools/rc11_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact RC10.1 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.10.1.zip DeckyShare-v1.1.0-rc.11.zip
          mkdir build
          gh release download v1.1.0-rc.10.1 --pattern 'DeckyShare-v1.1.0-rc.10.1.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.10.1.zip -d build
          test -f build/DeckyShare/core_main.py
          test -f build/DeckyShare/main.py
          test -f build/DeckyShare/dist/index.js
          test -f build/DeckyShare/updater.py

      - name: Apply RC11 mini file manager patch
        run: |
          set -euo pipefail
          python tools/rc11_patch.py build/DeckyShare

      - name: Validate RC11 package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('build/DeckyShare')
          pkg = json.loads((root / 'package.json').read_text())
          core = (root / 'core_main.py').read_text()
          js = (root / 'dist' / 'index.js').read_text()
          updater = (root / 'updater.py').read_text()
          main = (root / 'main.py').read_text()

          assert pkg['version'] == '1.1.0-rc.11'
          assert 'DeckyShare/1.1.0-rc11' in main
          for needle in ('file_mkdir', 'file_rename', 'file_copy', 'file_move', 'file_trash', 'file_details'):
              assert needle in core, needle
          for needle in ('fmSelect', 'Paste here', 'Trash', 'fmStorage', 'New folder'):
              assert needle in js, needle
          assert 'candidates = []' in updater
          assert 'compare_versions(candidate["version"], best["version"]) > 0' in updater

          for p in root.rglob('*.py'):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          subprocess.run(['node', '--check', str(root / 'dist' / 'index.js')], check=True)
          print('RC11 static validation passed')
          PY

          cd build
          zip -qr ../DeckyShare-v1.1.0-rc.11.zip DeckyShare
          cd ..

          python - <<'PY'
          import zipfile
          p = 'DeckyShare-v1.1.0-rc.11.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              for required in (
                  'DeckyShare/main.py',
                  'DeckyShare/core_main.py',
                  'DeckyShare/dist/index.js',
                  'DeckyShare/updater.py',
                  'DeckyShare/decky_http_server.py',
              ):
                  assert required in names, required
          print('RC11 ZIP validation passed')
          PY

      - name: Publish RC11 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.11 >/dev/null 2>&1; then
            echo 'RC11 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.1.0-rc.11 DeckyShare-v1.1.0-rc.11.zip \
            --prerelease \
            --target v1.1.0-rc11-release \
            --title 'DeckyShare v1.1.0-rc.11' \
            --notes 'RC11 turns Browse Files into a mini file manager: multi-select, New Folder, Rename, Copy, Move/Paste, safe Move to Trash with confirmation, file/folder Details, storage usage, and browsing of ordinary files. Built from the exact RC10.1 package, preserving the semantic-version updater fix, working Share Sheet backend, Decky 3.2.9 hardening, and RC9 icon/UI fixes.'
