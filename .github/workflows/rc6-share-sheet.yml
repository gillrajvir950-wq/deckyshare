name: Publish DeckyShare RC6 Share Sheet prerelease

on:
  push:
    branches:
      - v1.1.0-rc6-release
    paths:
      - .github/workflows/rc6-share-sheet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Download exact RC5 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.5.zip DeckyShare-v1.1.0-rc.6.zip
          mkdir build
          gh release download v1.1.0-rc.5 --pattern 'DeckyShare-v1.1.0-rc.5.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.5.zip -d build
          test -f build/DeckyShare/main.py
          test -f build/DeckyShare/decky_http_server.py

      - name: Add iPhone Share Sheet bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > build/DeckyShare/share_sheet.py <<'PYFILE'
          from __future__ import annotations

          import errno
          import html
          import mimetypes
          import os
          import secrets
          import time
          import urllib.parse
          from pathlib import Path


          def _settings_dir(decky) -> Path:
              configured = str(os.environ.get("DECKY_PLUGIN_SETTINGS_DIR") or "").strip()
              if configured:
                  return Path(configured)
              return Path(decky.DECKY_USER_HOME) / ".config" / "DeckyShare"


          def load_or_create_share_key(decky) -> str:
              base = _settings_dir(decky)
              path = base / "iphone-share-key.txt"
              try:
                  value = path.read_text(encoding="utf-8").strip()
                  if 24 <= len(value) <= 128:
                      return value
              except Exception:
                  pass
              value = secrets.token_urlsafe(32)
              try:
                  base.mkdir(parents=True, exist_ok=True)
                  path.write_text(value + "\n", encoding="utf-8")
                  try:
                      os.chmod(path, 0o600)
                  except OSError:
                      pass
              except Exception:
                  pass
              return value


          def authorized(provided: str, expected: str) -> bool:
              try:
                  return bool(provided) and secrets.compare_digest(str(provided), str(expected))
              except Exception:
                  return False


          def _extension_for_type(content_type: str) -> str:
              ctype = str(content_type or "").split(";", 1)[0].strip().lower()
              known = {
                  "text/plain": ".txt",
                  "text/uri-list": ".txt",
                  "application/pdf": ".pdf",
                  "image/jpeg": ".jpg",
                  "image/png": ".png",
                  "image/heic": ".heic",
                  "image/heif": ".heif",
                  "video/mp4": ".mp4",
                  "video/quicktime": ".mov",
              }
              if ctype in known:
                  return known[ctype]
              return mimetypes.guess_extension(ctype) or ".bin"


          def choose_name(query: dict, headers, content_type: str) -> str:
              raw = ""
              try:
                  raw = (query.get("name") or [""])[0]
              except Exception:
                  pass
              if not raw:
                  raw = str(headers.get("X-DeckyShare-Name") or "").strip()
              if raw:
                  safe = Path(urllib.parse.unquote(raw)).name.strip()
                  if safe and safe not in (".", ".."):
                      return safe[:240]
              stamp = time.strftime("%Y-%m-%d %H-%M-%S")
              ctype = str(content_type or "").lower()
              if ctype.startswith("text/"):
                  base = "Shared Text"
              elif ctype.startswith("image/"):
                  base = "Shared Photo"
              elif ctype.startswith("video/"):
                  base = "Shared Video"
              else:
                  base = "Shared File"
              return f"{base} {stamp}{_extension_for_type(content_type)}"


          def setup_info(base_url: str, key: str, qr_data_uri_fn=None) -> dict:
              base = str(base_url or "").rstrip("/") + "/"
              quoted = urllib.parse.quote(key, safe="")
              endpoint = f"{base}shortcut/share?key={quoted}&name=Shortcut%20Input"
              setup_url = f"{base}iphone?key={quoted}"
              result = {"enabled": True, "endpoint": endpoint, "setup_url": setup_url, "key_hint": key[-6:] if key else ""}
              if qr_data_uri_fn:
                  try:
                      result["setup_qr"] = qr_data_uri_fn(setup_url)
                  except Exception:
                      result["setup_qr"] = None
              return result


          def setup_page(base_url: str, key: str) -> str:
              info = setup_info(base_url, key)
              endpoint = html.escape(info["endpoint"])
              return f'''<!doctype html>
          <html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeckyShare • iPhone Share Sheet</title>
          <style>body{{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#0d1726;color:#fff;margin:0;padding:22px}}.wrap{{max-width:680px;margin:auto}}.card{{background:#13253b;border:1px solid #294866;border-radius:18px;padding:18px;margin:14px 0}}h1{{font-size:25px;margin:0 0 5px}}h2{{font-size:18px}}p,li{{line-height:1.45;color:#d6e6f5}}code{{display:block;word-break:break-all;background:#09121e;padding:12px;border-radius:12px;color:#8fd3ff}}button{{width:100%;padding:13px;border:0;border-radius:12px;background:#2d79b7;color:white;font-weight:700;font-size:16px}}.small{{font-size:13px;opacity:.72}}</style></head>
          <body><div class="wrap"><h1>📡 DeckyShare Share Sheet</h1><p>One-time setup. After this, Photos / Files / Safari → Share → DeckyShare can send straight to your Steam Deck.</p>
          <div class="card"><h2>Shortcut endpoint</h2><code id="ep">{endpoint}</code><br><button onclick="navigator.clipboard.writeText(document.getElementById('ep').innerText).then(()=>this.innerText='✓ Copied')">Copy endpoint</button></div>
          <div class="card"><h2>Create the “DeckyShare” shortcut</h2><ol><li>Open <b>Shortcuts</b> and create a shortcut named <b>DeckyShare</b>.</li><li>Enable <b>Show in Share Sheet</b> and allow Files, Images, Media, URLs and Text.</li><li>Add <b>Repeat with Each</b> using Share Sheet input.</li><li>Inside the repeat, get the item name and URL-encode it.</li><li>Add <b>Get Contents of URL</b>, choose <b>POST</b>, paste the endpoint above, replace <code>Shortcut%20Input</code> after <code>name=</code> with the encoded item name, and set request body to the repeated item.</li><li>Add a final notification: <b>Sent to DeckyShare</b>.</li></ol><p class="small">The secret key is already inside the endpoint. Keep this setup URL private on your local network.</p></div>
          <div class="card"><b>Tip:</b> Pin DeckyShare near the top of the iPhone Share Sheet for near one-tap sending.</div></div></body></html>'''


          def receive_raw(handler, state, query: dict, key: str, unique_destination_path, notify_file_received):
              provided = ""
              try:
                  provided = (query.get("key") or [""])[0]
              except Exception:
                  pass
              if not provided:
                  provided = str(handler.headers.get("X-DeckyShare-Key") or "").strip()
              if not authorized(provided, key):
                  return {"error": "Invalid iPhone Share Sheet key"}, 403
              try:
                  length = int(handler.headers.get("Content-Length", ""))
              except Exception:
                  return {"error": "Content-Length is required"}, 411
              if length < 0:
                  return {"error": "Invalid Content-Length"}, 400
              content_type = str(handler.headers.get("Content-Type") or "application/octet-stream")
              name = choose_name(query, handler.headers, content_type)
              target = (state.receive_dir / name).resolve()
              if state.receive_dir.resolve() not in target.parents:
                  return {"error": "Bad filename"}, 400
              final_target = unique_destination_path(target)
              part = final_target.with_name(f".{final_target.name}.deckyshare-share-{secrets.token_hex(6)}.part")
              tid = state.new_transfer("upload", final_target.name, length)
              received = 0
              try:
                  with open(part, "wb", buffering=0) as f:
                      remain = length
                      while remain:
                          chunk = handler.rfile.read(min(1024 * 1024, remain))
                          if not chunk:
                              break
                          f.write(chunk)
                          received += len(chunk)
                          remain -= len(chunk)
                          state.update_transfer(tid, received)
                  if received != length:
                      try: part.unlink()
                      except OSError: pass
                      state.update_transfer(tid, received, "failed")
                      return {"error": "Upload body ended early", "received": received}, 400
                  os.replace(part, final_target)
                  state.update_transfer(tid, received, "complete")
                  item = state.record_received(final_target)
                  notify_file_received(item)
                  return {"ok": True, "name": final_target.name, "path": str(final_target), "size": received, "source": "iphone-share-sheet"}, 200
              except OSError as exc:
                  state.update_transfer(tid, received, "failed")
                  try:
                      if part.exists(): part.unlink()
                  except OSError: pass
                  if exc.errno in (errno.ENOSPC, getattr(errno, "EDQUOT", 122)):
                      return {"error": "Not enough storage on Steam Deck"}, 507
                  return {"error": f"Could not save shared item: {exc}"}, 500
              except Exception as exc:
                  state.update_transfer(tid, received, "failed")
                  try:
                      if part.exists(): part.unlink()
                  except OSError: pass
                  return {"error": f"Share failed: {exc}"}, 500
          PYFILE

          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('build/DeckyShare')

          # Core backend routes + persistent pairing key.
          p = root / 'core_main.py'
          s = p.read_text()
          s = s.replace('from web_ui import html_page\n', '''from web_ui import html_page\nfrom share_sheet import (\n    load_or_create_share_key,\n    receive_raw as receive_share_sheet_raw,\n    setup_info as share_sheet_setup_info,\n    setup_page as share_sheet_setup_page,\n)\n''', 1)
          s = s.replace('        self.token = secrets.token_urlsafe(12)\n', '        self.token = secrets.token_urlsafe(12)\n        self.share_key = load_or_create_share_key(decky)\n', 1)
          marker = '        if u.path == "/plugin-status":\n'
          insert = '''        if u.path == "/iphone":\n            q = urllib.parse.parse_qs(u.query)\n            provided = (q.get("key") or [""])[0]\n            if not secrets.compare_digest(str(provided), str(STATE.share_key)):\n                self.send_error(403, "Invalid iPhone Share Sheet key")\n                return\n            base = f"http://{local_ip()}:{STATE.port}/"\n            data = share_sheet_setup_page(base, STATE.share_key).encode("utf-8")\n            self.send_response(200)\n            self.send_header("Content-Type", "text/html; charset=utf-8")\n            self.send_header("Content-Length", str(len(data)))\n            self.end_headers()\n            self.wfile.write(data)\n            return\n        if u.path == "/api/shortcut-config":\n            base = f"http://{local_ip()}:{STATE.port}/"\n            return self.send_json(share_sheet_setup_info(base, STATE.share_key, qr_data_uri))\n'''
          if marker not in s: raise SystemExit('GET marker missing')
          s = s.replace(marker, insert + marker, 1)
          old = '''    def do_POST(self):\n        u = urllib.parse.urlsplit(self.path)\n        if not self.token_ok():\n'''
          new = '''    def do_POST(self):\n        u = urllib.parse.urlsplit(self.path)\n        if u.path == "/shortcut/share":\n            q = urllib.parse.parse_qs(u.query)\n            result, status = receive_share_sheet_raw(self, STATE, q, STATE.share_key, unique_destination_path, notify_file_received)\n            return self.send_json(result, status)\n        if not self.token_ok():\n'''
          if old not in s: raise SystemExit('POST marker missing')
          s = s.replace(old, new, 1)
          old = '''            "received": STATE.received_snapshot(),\n            "roots": [{"name": n, "path": str(p)} for n, p in allowed_roots()],\n'''
          new = '''            "received": STATE.received_snapshot(),\n            "shortcut": share_sheet_setup_info(preferred["url"], STATE.share_key, qr_data_uri),\n            "roots": [{"name": n, "path": str(p)} for n, p in allowed_roots()],\n'''
          if old not in s: raise SystemExit('bootstrap marker missing')
          s = s.replace(old, new, 1)
          old = '''            "received": STATE.received_snapshot(),\n        }\n'''
          new = '''            "received": STATE.received_snapshot(),\n            "shortcut": share_sheet_setup_info(preferred["url"], STATE.share_key, qr_data_uri),\n        }\n'''
          if old not in s: raise SystemExit('status marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Frontend card.
          p = root / 'dist' / 'index.js'
          s = p.read_text()
          needle = '''      h(Card,null,\n        h(SectionTitle,{icon:"📁",title:"Browse Files",sub:status.selected?"File ready to download":"Choose a location, then select a file"}),\n'''
          card = '''      h(Card,{style:{border:"1px solid rgba(120,180,255,.22)"}},\n        h(SectionTitle,{icon:"📲",title:"iPhone Share Sheet",sub:"Photos / Files / Safari → Share → DeckyShare"}),\n        status.shortcut&&status.shortcut.setup_qr?\n          h("div",{style:{display:"flex",gap:12,alignItems:"center"}},\n            h("img",{src:status.shortcut.setup_qr,style:{width:82,height:82,background:"white",padding:4,borderRadius:10}}),\n            h("div",{style:{flex:1,minWidth:0}},\n              h("div",{style:{fontSize:12,fontWeight:740,marginBottom:4}},"Scan once to set up"),\n              h("div",{style:{fontSize:10,opacity:.62,lineHeight:1.4}},"Open this QR on iPhone and follow the 1-minute Shortcut setup. After that, send directly from the iOS Share Sheet."),\n              h("div",{style:{fontSize:9,opacity:.42,marginTop:6}},`Paired key •••${status.shortcut.key_hint||""}`)\n            )\n          ):\n          h("div",{style:{fontSize:11,opacity:.55}},"Share Sheet setup unavailable until a LAN address is ready.")\n      ),\n\n'''
          if needle not in s: raise SystemExit('Browse card marker missing')
          s = s.replace(needle, card + needle, 1)
          s = s.replace('v1.1.0-rc5', 'v1.1.0-rc6 • iPhone Share Sheet')
          p.write_text(s)

          # Version metadata and backend label.
          p = root / 'package.json'; data = json.loads(p.read_text()); data['version'] = '1.1.0-rc.6'; p.write_text(json.dumps(data, indent=2)+'\n')
          p = root / 'main.py'; s = p.read_text(); s = re.sub(r'_core\.Handler\.server_version = "DeckyShare/[^"]+"', '_core.Handler.server_version = "DeckyShare/1.1.0-rc6"', s, count=1); p.write_text(s)
          p = root / 'rc1_hardening.py'; s = p.read_text().replace('v1.1.0-rc5','v1.1.0-rc6').replace('v1.1.0-rc1','v1.1.0-rc6').replace('v1.1.0-rc2','v1.1.0-rc6'); p.write_text(s)
          PY

      - name: Validate RC6 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/DeckyShare')
          for p in root.rglob('*.py'):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          pkg=json.loads((root/'package.json').read_text())
          assert pkg['version']=='1.1.0-rc.6'
          core=(root/'core_main.py').read_text()
          js=(root/'dist/index.js').read_text()
          main=(root/'main.py').read_text()
          assert 'share_sheet.py' in [p.name for p in root.iterdir()]
          assert '/shortcut/share' in core
          assert 'load_or_create_share_key' in core
          assert 'iPhone Share Sheet' in js
          assert 'utilities/install_plugin' in js
          assert 'updater.prepare_install' in main
          assert 'decky_http_server' in core
          print('RC6 static validation passed')
          PY
          node --check build/DeckyShare/dist/index.js
          cd build
          zip -qr ../DeckyShare-v1.1.0-rc.6.zip DeckyShare
          cd ..
          unzip -t DeckyShare-v1.1.0-rc.6.zip >/dev/null

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.6 >/dev/null 2>&1; then
            echo 'v1.1.0-rc.6 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.1.0-rc.6 DeckyShare-v1.1.0-rc.6.zip \
            --prerelease \
            --target v1.1.0-rc6-release \
            --title 'DeckyShare v1.1.0-rc.6' \
            --notes 'RC6 adds the first iPhone Share Sheet bridge: persistent local pairing key, QR-guided Shortcut setup, raw Share Sheet uploads into Downloads/DeckShare, duplicate-safe filenames, transfer progress and Decky receive notifications. Built directly from the exact RC5 release asset so Decky 3.2.9 startup hardening and native updater behavior stay unchanged.'
