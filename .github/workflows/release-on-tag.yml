name: Release on tag

# Publishes a DeckyShare release whenever a version tag (v*) is pushed.
# Tags with a "-" (e.g. v1.1.0-rc.11.32) are published as pre-releases,
# which is the channel RC builds of the in-plugin updater follow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Run tests
        run: python3 -m pip install -q pytest && python3 -m pytest -q tests

      - name: Check frontend bundle syntax
        run: node --check dist/index.js

      - name: Build plugin ZIP
        run: |
          rm -rf build && mkdir -p build/DeckyShare/py_modules
          cp main.py core_main.py decky_http_server.py \
             exactly_once.py exactly_once_bootstrap.py notification_state.py \
             rc1_hardening.py restart_hardening.py share_sheet.py \
             transfer_integrity.py updater.py web_ui.py \
             package.json plugin.json README.md CHANGELOG.md LICENSE \
             build/DeckyShare/
          cp -R dist build/DeckyShare/
          cp -R py_modules/qrcode build/DeckyShare/py_modules/
          find build -name '__pycache__' -prune -exec rm -rf {} +
          (cd build && zip -qr "../DeckyShare-v${VERSION}.zip" DeckyShare)
          unzip -t "DeckyShare-v${VERSION}.zip"

      - name: Validate ZIP with the plugin's own updater checks
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("u", "updater.py")
          u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          v = os.environ["VERSION"]
          u.validate_update_zip(Path(f"DeckyShare-v{v}.zip"), v)
          print("ZIP valid for updater")
          PY

      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## v{re.escape(v)}\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          open("notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else f"DeckyShare v{v}") + "\n")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${VERSION}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "DeckyShare-v${VERSION}.zip" \
            --title "DeckyShare v${VERSION}" --notes-file notes.md \
            --verify-tag ${PRE}
