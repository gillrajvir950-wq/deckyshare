name: Publish DeckyShare RC11.3 simplified file manager UI

on:
  push:
    branches: [v1.1.0-rc11-release]
    paths: [.github/workflows/rc11-3-filemanager-ui.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact RC11.2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build DeckyShare-v1.1.0-rc.11.2.zip DeckyShare-v1.1.0-rc.11.3.zip
          mkdir build
          gh release download v1.1.0-rc.11.2 --pattern 'DeckyShare-v1.1.0-rc.11.2.zip' --dir .
          unzip -q DeckyShare-v1.1.0-rc.11.2.zip -d build
      - name: Simplify Browse Files UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('build/DeckyShare'); p=root/'dist/index.js'; s=p.read_text()
          old='[fmTrashArmed,setFmTrashArmed]=useState(false),[browseLimit,setBrowseLimit]=useState(50);'
          new='[fmTrashArmed,setFmTrashArmed]=useState(false),[browseLimit,setBrowseLimit]=useState(50),[fmLocationsOpen,setFmLocationsOpen]=useState(false),[fmStorageOpen,setFmStorageOpen]=useState(false),[fmSortOpen,setFmSortOpen]=useState(false);'
          assert old in s; s=s.replace(old,new,1)
          old='''h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:7}},
            h(MiniButton,{onClick:()=>{setPath(null);setParent(null);setItems([]);setBrowseQuery("");}},"← Locations"),
            parent&&h(MiniButton,{onClick:()=>browse(parent)},"↑ Up"),
            h(MiniButton,{onClick:()=>{setFmSelect(v=>!v);setFmPicked([]);setFmInfo(null);}},fmSelect?"Done":"Select"),
            h(MiniButton,{onClick:()=>setFmNew(fmNew?"":"New folder")},fmNew?"Cancel folder":"＋ New folder")
          ),
          fmStorage&&h("div",{style:{fontSize:9,opacity:.55,marginBottom:6}},`${fmStorage.used_human} used • ${fmStorage.free_human} free`,h(Bar,{value:fmUsed})),'''
          new='''h("div",{style:{display:"grid",gridTemplateColumns:"auto 1fr auto auto",gap:5,alignItems:"center",marginBottom:7}},
            parent&&h("button",{onClick:()=>browse(parent),style:{padding:"7px 9px",borderRadius:9,border:"1px solid rgba(120,180,255,.14)",background:"rgba(255,255,255,.025)",color:"#d9edff",fontWeight:800}},"←"),
            h("div",{style:{minWidth:0,fontSize:10,fontWeight:760,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",padding:"0 3px"}},browseCrumbs.length?browseCrumbs.map(c=>c.label).join(" › "):"Files"),
            h("button",{onClick:()=>{setFmSelect(v=>!v);setFmPicked([]);setFmInfo(null);},style:{padding:"7px 9px",borderRadius:9,border:fmSelect?"1px solid #66c0f4":"1px solid rgba(120,180,255,.14)",background:fmSelect?"rgba(102,192,244,.14)":"rgba(255,255,255,.025)",color:"#d9edff",fontSize:10,fontWeight:760}},fmSelect?"Done":"Select"),
            h("button",{onClick:()=>setFmNew(fmNew?"":"New folder"),style:{width:34,height:34,borderRadius:9,border:"1px solid rgba(120,180,255,.14)",background:"rgba(255,255,255,.025)",color:"#d9edff",fontSize:18,fontWeight:700}},fmNew?"×":"+")
          ),
          fmStorage&&h("button",{onClick:()=>setFmStorageOpen(v=>!v),style:{width:"100%",textAlign:"left",padding:"5px 7px",marginBottom:6,borderRadius:8,border:"1px solid rgba(120,180,255,.08)",background:"rgba(255,255,255,.015)",color:"white",fontSize:9,opacity:.65}},fmStorageOpen?`${fmStorage.used_human} used • ${fmStorage.free_human} free ▲`:`Storage • ${fmStorage.free_human} free ▼`),
          fmStorage&&fmStorageOpen&&h("div",{style:{margin:"-2px 3px 7px"}},h(Bar,{value:fmUsed})),'''
          assert old in s; s=s.replace(old,new,1)
          old='''h("div",{style:{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",padding:"7px 8px",borderRadius:9,background:"rgba(7,17,29,.34)",border:"1px solid rgba(120,180,255,.10)",marginBottom:8}},
            browseCrumbs.map((c,i)=>h(React.Fragment,{key:c.path},
              i>0&&h("span",{style:{fontSize:9,opacity:.34}},"›"),
              h("button",{onClick:()=>c.path===path?null:browse(c.path),disabled:c.path===path,style:{padding:"2px 4px",border:0,background:"transparent",color:c.path===path?"#fff":"#8fd3ff",fontSize:9,fontWeight:c.path===path?760:620,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},c.label)
            ))
          ),
          h("div",{style:{display:"grid",gap:6,marginBottom:7}},
            h("input",{value:browseQuery,onChange:e=>{setBrowseQuery(e.target.value);setBrowseLimit(50);},placeholder:"Search this folder",style:{minWidth:0,width:"100%",boxSizing:"border-box",padding:"9px 10px",borderRadius:10,border:"1px solid rgba(120,180,255,.18)",background:"rgba(7,17,29,.48)",color:"white",fontSize:11,outline:"none"}}),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5}},
              [["name","Name"],["date","Newest"],["size","Largest"]].map(([value,label])=>h("button",{key:value,onClick:()=>{if(browseSort!==value){setBrowseSort(value);setBrowseLimit(50);}},style:{padding:"7px 5px",borderRadius:9,border:browseSort===value?"1px solid #66c0f4":"1px solid rgba(120,180,255,.16)",background:browseSort===value?"rgba(102,192,244,.15)":"rgba(255,255,255,.025)",color:browseSort===value?"#bde7ff":"#d9edff",fontSize:10,fontWeight:700}},label))
            )
          ),
          h("div",{style:{display:"flex",gap:4,overflowX:"auto",paddingBottom:4,marginBottom:4}},roots.map(r=>h("button",{key:r.path,onClick:()=>browse(r.path),style:{flex:"0 0 auto",padding:"5px 7px",borderRadius:999,border:path===r.path?"1px solid #66c0f4":"1px solid rgba(120,180,255,.14)",background:path===r.path?"rgba(102,192,244,.13)":"rgba(255,255,255,.025)",color:path===r.path?"#a9ddff":"#d9edff",fontSize:9,fontWeight:700}},r.name.startsWith("Drive:")?`💾 ${r.name.replace("Drive: ","")}`:r.name))),'''
          new='''h("div",{style:{display:"grid",gridTemplateColumns:"1fr auto auto",gap:5,marginBottom:7}},
            h("input",{value:browseQuery,onChange:e=>{setBrowseQuery(e.target.value);setBrowseLimit(50);},placeholder:"Search files…",style:{minWidth:0,width:"100%",boxSizing:"border-box",padding:"9px 10px",borderRadius:10,border:"1px solid rgba(120,180,255,.18)",background:"rgba(7,17,29,.48)",color:"white",fontSize:11,outline:"none"}}),
            h("button",{onClick:()=>setFmSortOpen(v=>!v),style:{padding:"7px 9px",borderRadius:9,border:"1px solid rgba(120,180,255,.14)",background:"rgba(255,255,255,.025)",color:"#d9edff",fontSize:10,fontWeight:760}},`Sort: ${browseSort==="date"?"Newest":browseSort==="size"?"Largest":"Name"} ▾`),
            h("button",{onClick:()=>setFmLocationsOpen(v=>!v),style:{padding:"7px 9px",borderRadius:9,border:"1px solid rgba(120,180,255,.14)",background:"rgba(255,255,255,.025)",color:"#d9edff",fontSize:10,fontWeight:760}},"Locations")
          ),
          fmSortOpen&&h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,marginBottom:7}},[["name","Name"],["date","Newest"],["size","Largest"]].map(([value,label])=>h("button",{key:value,onClick:()=>{setBrowseSort(value);setBrowseLimit(50);setFmSortOpen(false);},style:{padding:"7px 5px",borderRadius:9,border:browseSort===value?"1px solid #66c0f4":"1px solid rgba(120,180,255,.12)",background:browseSort===value?"rgba(102,192,244,.14)":"rgba(255,255,255,.02)",color:"#d9edff",fontSize:10,fontWeight:700}},label))),
          fmLocationsOpen&&h("div",{style:{display:"flex",gap:4,overflowX:"auto",paddingBottom:6,marginBottom:4}},roots.map(r=>h("button",{key:r.path,onClick:()=>{setFmLocationsOpen(false);browse(r.path);},style:{flex:"0 0 auto",padding:"6px 8px",borderRadius:999,border:path===r.path?"1px solid #66c0f4":"1px solid rgba(120,180,255,.14)",background:path===r.path?"rgba(102,192,244,.13)":"rgba(255,255,255,.025)",color:"#d9edff",fontSize:9,fontWeight:700}},r.name.startsWith("Drive:")?`💾 ${r.name.replace("Drive: ","")}`:r.name))),'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('"RC11.2"','"RC11.3"',1)
          p.write_text(s)
          pkg=root/'package.json'; d=json.loads(pkg.read_text()); d['version']='1.1.0-rc.11.3'; pkg.write_text(json.dumps(d,indent=2)+'\n')
          mp=root/'main.py'; ms=mp.read_text(); ms=re.sub(r'_core\.Handler\.server_version = "DeckyShare/[^"]+"','_core.Handler.server_version = "DeckyShare/1.1.0-rc11.3"',ms,count=1); mp.write_text(ms)
          PY
      - name: Validate RC11.3
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/DeckyShare'); ui=(root/'dist/index.js').read_text(); pkg=json.loads((root/'package.json').read_text())
          assert pkg['version']=='1.1.0-rc.11.3'
          for x in ['Search files…','Sort: ${browseSort','Locations','Storage •','fmSortOpen','fmLocationsOpen','RC11.3','visibleBrowseItems.slice(0,browseLimit)']: assert x in ui
          assert 'gridTemplateColumns:"repeat(3,1fr)",gap:5}},\n              [["name","Name"]' not in ui
          for f in root.rglob('*.py'): compile(f.read_text(),str(f),'exec')
          print('RC11.3 simplified UI validation passed')
          PY
          cd build && zip -qr ../DeckyShare-v1.1.0-rc.11.3.zip DeckyShare && cd ..
      - name: Publish RC11.3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.0-rc.11.3 DeckyShare-v1.1.0-rc.11.3.zip --prerelease --target v1.1.0-rc11-release --title 'DeckyShare v1.1.0-rc.11.3' --notes 'RC11.3 simplifies Browse Files using a Dolphin/iOS Files-inspired hierarchy: compact back/path/select/+ toolbar, collapsible storage, single Search + Sort + Locations row, hidden sort choices and locations until requested, and more room for the file list. RC11.2 performance protections and all mini file-manager operations are preserved.'
