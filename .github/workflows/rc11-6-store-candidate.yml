name: Publish DeckyShare RC11.6 store candidate

on:
  push:
    branches:
      - store-v1.1.0-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          node --check dist/index.js

      - name: Run backend and security tests
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q
          python -m py_compile *.py

      - name: Validate metadata and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          manifest = json.loads(Path('plugin.json').read_text())
          ui = Path('dist/index.js').read_text()
          backend = Path('core_main.py').read_text()
          assert package['version'] == '1.1.0-rc.11.6'
          assert manifest['publish']['image'].startswith('https://')
          for marker in ('RC11.6', 'handleControllerBack', 'DialogButton', 'Focusable', 'TextField'):
              assert marker in ui, marker
          for marker in ('secrets.compare_digest', 'SameSite=Strict', 'HttpOnly', 'loopback_client'):
              assert marker in backend, marker
          PY

          rm -rf /tmp/deckyshare-store-build
          mkdir -p /tmp/deckyshare-store-build/DeckyShare
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'src/' \
            --exclude 'tests/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.zip' \
            --exclude 'release/' \
            ./ /tmp/deckyshare-store-build/DeckyShare/
          cd /tmp/deckyshare-store-build
          zip -qr "$GITHUB_WORKSPACE/DeckyShare-v1.1.0-rc.11.6.zip" DeckyShare

          cd "$GITHUB_WORKSPACE"
          unzip -t DeckyShare-v1.1.0-rc.11.6.zip

      - name: Publish RC11.6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v1.1.0-rc.11.6 >/dev/null 2>&1; then
            gh release create v1.1.0-rc.11.6 DeckyShare-v1.1.0-rc.11.6.zip \
              --prerelease \
              --target store-v1.1.0-prep \
              --title 'DeckyShare v1.1.0-rc.11.6' \
              --notes 'Store-candidate build. Includes RC11.5 native controller navigation plus authenticated LAN sessions, strict session cookies, loopback-only internal endpoints, reproducible frontend source, Store metadata, and automated backend/security tests.'
