name: Publish DeckyShare RC11.13 compact toolbar

on:
  push:
    branches:
      - store-v1.1.0-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          node --check dist/index.js

      - name: Run backend and security tests
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q
          python -m py_compile *.py

      - name: Validate metadata and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          manifest = json.loads(Path('plugin.json').read_text())
          ui = Path('dist/index.js').read_text()
          backend = Path('core_main.py').read_text()
          assert package['version'] == '1.1.0-rc.11.13'
          assert manifest['publish']['image'].startswith('https://')
          for marker in ('RC11.13', 'inset 3px 0 0 #66c0f4', 'deckyshare-compact-action', 'handleControllerBack', 'CONTROLLER_FOCUS_STYLE', 'AccordionCard', 'aria-expanded', 'compact: true', 'noFocusRing', 'DialogButton', 'Focusable', 'TextField'):
              assert marker in ui, marker
          for marker in ('secrets.compare_digest', 'SameSite=Strict', 'HttpOnly', 'loopback_client'):
              assert marker in backend, marker
          assert 'from decky_http_server import BaseHTTPRequestHandler, ThreadingHTTPServer' in backend
          assert 'socket.getaddrinfo(socket.gethostname()' not in backend
          assert '_START_SERVER_LOCK = threading.Lock()' in backend
          assert 'updater.prepare_install' in Path('main.py').read_text()
          assert 'def prepare_install(' in Path('updater.py').read_text()
          PY

          rm -rf /tmp/deckyshare-store-build
          mkdir -p /tmp/deckyshare-store-build/DeckyShare
          cp \
            main.py core_main.py decky_http_server.py \
            exactly_once.py exactly_once_bootstrap.py notification_state.py \
            rc1_hardening.py restart_hardening.py share_sheet.py \
            transfer_integrity.py updater.py web_ui.py \
            package.json plugin.json README.md CHANGELOG.md LICENSE \
            /tmp/deckyshare-store-build/DeckyShare/
          cp -R dist /tmp/deckyshare-store-build/DeckyShare/
          mkdir -p /tmp/deckyshare-store-build/DeckyShare/py_modules
          rsync -a \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            py_modules/ /tmp/deckyshare-store-build/DeckyShare/py_modules/
          cd /tmp/deckyshare-store-build
          zip -qr "$GITHUB_WORKSPACE/DeckyShare-v1.1.0-rc.11.13.zip" DeckyShare

          cd "$GITHUB_WORKSPACE"
          unzip -t DeckyShare-v1.1.0-rc.11.13.zip

      - name: Publish RC11.13 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.11.13 >/dev/null 2>&1; then
            gh release upload v1.1.0-rc.11.13 DeckyShare-v1.1.0-rc.11.13.zip --clobber
          else
            gh release create v1.1.0-rc.11.13 DeckyShare-v1.1.0-rc.11.13.zip \
              --prerelease \
              --target store-v1.1.0-prep \
              --title 'DeckyShare v1.1.0-rc.11.13' \
              --notes 'Removes the external focus glow, brightness boost, and scale effect in favor of a thin border and inset marker. Rebuilds Browse Files with a compact path row and always-visible 26px Locations, Select, and New folder controls; removes the oversized ellipsis menu.'
          fi
