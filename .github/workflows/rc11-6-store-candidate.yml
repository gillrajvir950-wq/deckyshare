name: Publish DeckyShare RC11.22 persistent HTTP upload

on:
  push:
    branches:
      - store-v1.1.0-prep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          node --check dist/index.js

      - name: Run backend and security tests
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q
          python -m py_compile *.py

      - name: Validate metadata and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          manifest = json.loads(Path('plugin.json').read_text())
          ui = Path('dist/index.js').read_text()
          backend = Path('core_main.py').read_text()
          assert package['version'] == '1.1.0-rc.11.22'
          assert manifest['publish']['image'].startswith('https://')
          for marker in ('RC11.22', 'inset 3px 0 0 #66c0f4', 'deckyshare-compact-action', 'handleControllerBack', 'CONTROLLER_FOCUS_STYLE', 'AccordionCard', 'aria-expanded', 'compact: true', 'noFocusRing', 'DialogButton', 'Focusable', 'TextField'):
              assert marker in ui, marker
          assert 'Android Share Sheet' not in ui
          for marker in ('secrets.compare_digest', 'SameSite=Strict', 'HttpOnly', 'loopback_client'):
              assert marker in backend, marker
          assert 'from decky_http_server import BaseHTTPRequestHandler, ThreadingHTTPServer' in backend
          assert 'socket.getaddrinfo(socket.gethostname()' not in backend
          assert '_START_SERVER_LOCK = threading.Lock()' in backend
          assert 'updater.prepare_install' in Path('main.py').read_text()
          assert 'def prepare_install(' in Path('updater.py').read_text()
          android = Path('android/app/src/main/java/com/deckyshare/android/MainActivity.java').read_text()
          service = Path('android/app/src/main/java/com/deckyshare/android/ShareUploadService.java').read_text()
          assert 'ACTION_SEND_MULTIPLE' in android
          assert 'ShareUploadService.enqueue(this, intent)' in android
          assert 'finishAndRemoveTask()' in android
          assert 'setFixedLengthStreamingMode(item.size)' in service
          assert 'startForeground(NOTIFICATION_ID' in service
          transport = Path('decky_http_server.py').read_text()
          assert 'sendall(view)' in transport
          assert 'SOCKET_BUFFER_BYTES = 8 * 1024 * 1024' in transport
          assert "protocol_version = 'HTTP/1.1'" in transport
          assert 'KEEP_ALIVE_TIMEOUT_SECONDS = 30' in transport
          assert "buffering=1024*1024" in transport
          assert 'min(16 * 1024 * 1024, remain)' in backend
          web = Path('web_ui.py').read_text()
          for marker in ('@media(max-width:700px)', '@media(min-width:701px)', 'safe-area-inset-bottom', 'download-row', 'let chunk=4*1024*1024', 'new Worker(', 'prepareUploadChunk', 'new AbortController()', 'signal:controller.signal', 'controller.abort()', 'Cancelling now…'):
              assert marker in web, marker
          reliability = Path('exactly_once.py').read_text()
          for marker in ('cancel_event', 'cleanup_pending', 'status="cancelled"'):
              assert marker in reliability, marker
          PY

          rm -rf /tmp/deckyshare-store-build
          mkdir -p /tmp/deckyshare-store-build/DeckyShare
          cp \
            main.py core_main.py decky_http_server.py \
            exactly_once.py exactly_once_bootstrap.py notification_state.py \
            rc1_hardening.py restart_hardening.py share_sheet.py \
            transfer_integrity.py updater.py web_ui.py \
            package.json plugin.json README.md CHANGELOG.md LICENSE \
            /tmp/deckyshare-store-build/DeckyShare/
          cp -R dist /tmp/deckyshare-store-build/DeckyShare/
          mkdir -p /tmp/deckyshare-store-build/DeckyShare/py_modules
          rsync -a \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            py_modules/ /tmp/deckyshare-store-build/DeckyShare/py_modules/
          cd /tmp/deckyshare-store-build
          zip -qr "$GITHUB_WORKSPACE/DeckyShare-v1.1.0-rc.11.22.zip" DeckyShare

          cd "$GITHUB_WORKSPACE"
          unzip -t DeckyShare-v1.1.0-rc.11.22.zip

      - name: Publish RC11.22 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.11.22 >/dev/null 2>&1; then
            gh release upload v1.1.0-rc.11.22 DeckyShare-v1.1.0-rc.11.22.zip --clobber
          else
            gh release create v1.1.0-rc.11.22 DeckyShare-v1.1.0-rc.11.22.zip \
              --prerelease \
              --target store-v1.1.0-prep \
              --title 'DeckyShare v1.1.0-rc.11.22' \
              --notes 'Keeps one HTTP/1.1 connection alive across sequential 4 MiB upload chunks instead of rebuilding TCP for every request. Includes the Safari CRC worker and pipelined preparation from RC11.21, with a bounded idle timeout and safe error closure.'
          fi
